services:

  mysql:
    image: mysql:8.0

    container_name: competencias_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: competencias_matematicas_v2
      MYSQL_ROOT_HOST: "%"

    ports:
      - "1032:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/competencias_matematicas_v2.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:

    build:
      context: ./backend

    container_name: competencias_backend

    restart: always

    depends_on:
      - mysql

    env_file:
      - ./backend/.env.docker

    ports:
      - "1031:1031"

    volumes:
      - ./backend:/app

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 1031
      --reload

  frontend:

    build:
      context: ./frontend

    container_name: competencias_frontend

    restart: always

    depends_on:
      - backend

    ports:
      - "1030:1030"

    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mysql_data:
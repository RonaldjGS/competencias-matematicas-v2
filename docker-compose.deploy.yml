services:

  mysql:
    image: jucacero82/competencias-mysql:latest

    restart: always

    ports:
      - "1032:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    image: jucacero82/competencias-backend:latest

    restart: always

    depends_on:
      - mysql

    environment:
      DATABASE_URL: mysql+pymysql://root:root@mysql:3306/competencias_matematicas_v2
      SECRET_KEY: "CompetenciasMatematicas2026$JWT#Segura"
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480

    ports:
      - "1031:1031"

    volumes:
      - uploads_data:/app/uploads

  frontend:
    image: jucacero82/competencias-frontend:latest

    restart: always

    depends_on:
      - backend

    ports:
      - "1030:80"

volumes:
  mysql_data:
  uploads_data:
<!-- ===================================== -->
    <!-- SIDEBAR -->
    <!-- ===================================== -->

    <aside
      class="sidebar"
      [class.collapsed]="!menuAbierto"
    >

      <button
        class="menu-btn"
        (click)="toggleMenu()"
      >
        <i class="bi bi-list"></i>
      </button>

      <ul>

        <li (click)="irInicio()">

          <i class="bi bi-house"></i>

          <span *ngIf="menuAbierto">

              Inicio

          </span>

        </li>

        <li (click)="irProgreso()">

          <i class="bi bi-graph-up"></i>

          <span *ngIf="menuAbierto">
            Mi progreso
          </span>

        </li>

        <li (click)="irHistorial()">

          <i class="bi bi-clock-history"></i>

          <span *ngIf="menuAbierto">

              Historial

          </span>

      </li>

      <li (click)="irContenidoAcademico()">

        <i class="bi bi-book"></i>

        <span *ngIf="menuAbierto">

            Biblioteca Matemática

        </span>

      </li>

        <li
          class="cerrar-sesion"
          (click)="cerrarSesion()">

          <span>

              <i class="bi bi-box-arrow-right"></i>

          </span>

          <span *ngIf="menuAbierto">

              Cerrar sesión

          </span>

        </li>

      </ul>

    </aside>

<aside

class="sidebar"

[class.collapsed]="!menuAbierto"

>

    <button

        class="menu-btn"

        (click)="toggleMenu()"

    >

        <i class="bi bi-list"></i>

    </button>

    <ul>

        <li (click)="irInicio()">

            <i class="bi bi-house"></i>

            <span *ngIf="menuAbierto">

                Inicio

            </span>

        </li>

        <li (click)="irPreguntas()">

            <i class="bi bi-patch-question"></i>

            <span *ngIf="menuAbierto">

                Preguntas

            </span>

        </li>

        <li (click)="irVideos()">

            <i class="bi bi-play-circle"></i>

            <span *ngIf="menuAbierto">

                Videos

            </span>

        </li>

        <li (click)="irEstudiantes()">

            <i class="bi bi-people"></i>

            <span *ngIf="menuAbierto">

                Estudiantes

            </span>

        </li>

        <li (click)="irContenidoAcademico()">

            <i class="bi bi-folder2-open"></i>

            <span *ngIf="menuAbierto">

                Contenido

            </span>

        </li>

        <li

            class="cerrar-sesion"

            (click)="cerrarSesion()"

        >

            <i class="bi bi-box-arrow-right"></i>

            <span *ngIf="menuAbierto">

                Cerrar sesión

            </span>

        </li>

    </ul>

</aside>

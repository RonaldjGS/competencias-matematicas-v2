<app-topbar-profesor

    [nombreProfesor]="nombreProfesor"

    (menuToggle)="toggleMenu()"

>

</app-topbar-profesor>

<app-sidebar-profesor
    [(menuAbierto)]="menuAbierto">
</app-sidebar-profesor>

<main
    class="contenido"
    [class.menu-cerrado]="!menuAbierto">

    <section class="cabecera">

        <h1>{{ tituloPagina }}</h1>

        <p>{{ descripcionPagina }}</p>

    </section>

    <div class="tabs">

        <button

            class="tab"

            [class.activo]="
                pestanaActual==='importar'
            "

            (click)="
                cambiarPestana('importar')
            ">

            Importar preguntas

        </button>

        <button

            class="tab"

            [class.activo]="
                pestanaActual==='banco'
            "

            (click)="
                cambiarPestana('banco')
            ">

            Banco de preguntas

        </button>

        <button

            class="tab"

            [class.activo]="
                pestanaActual==='quiz'
            "

            (click)="
                cambiarPestana('quiz')
            ">

            Configuración Quiz

        </button>

    </div>

    @if(pestanaActual==='importar'){

        <app-importar-preguntas/>

    }

    @if(pestanaActual==='banco'){

        <app-banco-preguntas/>

    }

    @if(pestanaActual==='quiz'){

    <app-configuracion-quiz/>

    }

</main>
